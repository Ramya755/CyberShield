name: cybershield
description: "A Flutter security application for detecting and reporting threats, SMS scams, and malicious links."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  http: ^1.1.0
  provider: ^6.1.0
  tflite: ^1.1.2
  realm: ^1.1.0
  intl: ^0.19.0
  uuid: ^4.0.0
  sqflite: ^2.3.0
  url_launcher: ^6.2.0
  mongo_dart: ^0.10.8
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
